[metadata]
name = apm
version = 0.1.0
description = Addressed Parameter Memory continual-learning research prototypes.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    jax>=0.4
    numpy>=1.22
    optax>=0.2
    pyrsistent>=0.20

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=8
