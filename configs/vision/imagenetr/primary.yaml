experiment:
  name: imagenetr50_logt_vamp
  seed: 1993

paths:
  artifact_root: artifacts/imagenetr50
  data_root: data/imagenetr50

dataset:
  classes: 200
  tasks: 50
  classes_per_task: 4
  train_fraction: 0.8
  input_size: 224

backbone:
  model: vit_base_patch16_224.augreg_in21k
  precision: bfloat16

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  targets:
    - attention.qkv
    - mlp.fc1

leaf_training:
  epochs: 5
  batch_size: 64
  optimizer: sgd
  momentum: 0.9
  weight_decay: 5.0e-4
  lora_lr: 5.0e-4
  head_lr: 1.0e-2

joint_training:
  epochs: 5
  batch_size: 64
  optimizer: sgd
  momentum: 0.9
  weight_decay: 5.0e-4
  lora_lr: 5.0e-4
  head_lr: 1.0e-2

bank:
  max_live_nodes_per_level: 2

merge:
  output_rank: 16
  scale: 1.0

proxy:
  images_per_node: 16

repair:
  fractions:
    - 0.0
    - 0.01
    - 0.05
  primary_fraction: 0.05
  material_improvement_points: 0.25
  training:
    epochs: 1
    batch_size: 64
    optimizer: sgd
    momentum: 0.9
    weight_decay: 5.0e-4
    lora_lr: 2.5e-4
    head_lr: 5.0e-3

routing:
  score_modes:
    - raw
    - cosine
    - affine_calibrated
  cosine_scale: 16.0

runtime:
  num_workers: 12
  checkpoint_steps: 50
  smoke_tasks: 8
