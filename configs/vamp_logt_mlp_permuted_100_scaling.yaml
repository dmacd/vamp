  data_root: data/torchvision/MNIST/raw
  calibration_evidence_run: artifacts/vamp-logt-mlp-permuted-mnist-ungated/runs/d38c612562699eb55c578a48a8ea94639596c4009a539c1092b63b76eb4f26c0

benchmark:
  macro_steps: 100
  permutation_seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019, 1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029, 1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039, 1040, 1041, 1042, 1043, 1044, 1045, 1046, 1047, 1048, 1049, 1050, 1051, 1052, 1053, 1054, 1055, 1056, 1057, 1058, 1059, 1060, 1061, 1062, 1063, 1064, 1065, 1066, 1067, 1068, 1069, 1070, 1071, 1072, 1073, 1074, 1075, 1076, 1077, 1078, 1079, 1080, 1081, 1082, 1083, 1084, 1085, 1086, 1087, 1088, 1089, 1090, 1091, 1092, 1093, 1094, 1095, 1096, 1097, 1098, 1099]
  stream_seed: 20260827
  model_batch_size: 256
  observer_batch_size: 256
  evaluation_batch_size: 128

calibration:
  candidate_widths:
    - [1024, 1024, 512]
    - [1536, 1536, 768]
    - [2048, 2048, 1024]
  seeds: [0, 1, 2]
  split_seed: 20260831
  training_source_examples: 50000
  validation_source_examples: 10000
  dropout: 0.2
  optimizer:
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 256
    gradient_clip_norm: 1.0
  convergence:
    minimum_epochs: 20
    maximum_epochs: 100
    improvement_delta: 0.0001
    learning_rate_patience: 5
    learning_rate_factor: 0.5
    minimum_learning_rate: 0.00001
    convergence_patience: 10
  selection_policy: smallest_candidate
  identity_mean_accuracy_minimum: 0.97
  identity_seed_zero_accuracy_minimum: 0.97
  pooled_gap_from_widest_maximum: 0.0025

node:
  epochs: 20
  dropout: 0.2
  optimizer:
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    gradient_clip_norm: 1.0

observer:
  maximum_levels: 7
  inference_batch_size: 2048
  hidden_normalization: per_example_layer_norm

router:
  maximum_levels: 7
  hidden_widths: [1024, 512, 256]
  dropout: 0.1
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  minibatch_size: 128
  epochs_per_step: 4
  target_temperature: 0.10
  conditions: [router_current_hard, router_uniform_hard, router_range_hard, router_uniform_soft, router_range_soft]

integrator:
  maximum_levels: 7
  hidden_widths: [1024, 512, 256]
  dropout: 0.1
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  minibatch_size: 128
  current_source_weight: 0.5
  epochs_per_step: 4
  offline_epochs: 20
  conditions: [integrator_uniform_replay]

online:
  seeds: [0, 1, 2, 3, 4]
  historical_budget: 256

scaling:
  hierarchy_node_capacities: [1, 2]
  predecessor_run: artifacts/vamp-logt-mlp-permuted-mnist-100-scaling/runs/6d4f13fdf7d3aad964b1d8becae3fa7130e05422548576912e6e830506a3710c

ceiling:
  restarts_per_step: 1
  convergence:
    minimum_epochs: 20
    maximum_epochs: 20
    improvement_delta: 0.0001
    learning_rate_patience: 5
    learning_rate_factor: 0.5
    minimum_learning_rate: 0.00001
    convergence_patience: 10

evaluation:
  test_subset_per_domain: 256
  full_checkpoints: [1, 2, 4, 8, 10, 16, 26, 41, 66, 100]
  headline_checkpoints: [1, 2, 4, 8, 10, 16, 26, 41, 66, 100]

runtime:
  device: cuda
  deterministic_algorithms: true
  progress: true
