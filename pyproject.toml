[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apm"
version = "0.1.0"
description = "Addressed Parameter Memory continual-learning research prototypes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "numpy>=1.22",
    "optax>=0.2",
    "pyrsistent>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
pc = [
    "fabricpc @ git+ssh://git@github.com/matthewbehrend/FabricPC.git@main",
]
gpu = [
    "jax[cuda12]>=0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
