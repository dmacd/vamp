[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apm"
version = "0.1.0"
description = "VAMP architectural continual-learning research prototypes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "matplotlib>=3.8",
    "numpy>=1.22",
    "optax>=0.2",
    "pyrsistent>=0.20",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
]
pc = [
    "fabricpc @ git+ssh://git@github.com/matthewbehrend/FabricPC.git@main",
]
gpu = [
    "jax[cuda12]>=0.6.2",
]
lm = [
    "huggingface_hub",
    "tokenizers",
    "safetensors",
]
semantic = [
    "huggingface_hub",
    "safetensors",
    "torch>=2",
    "transformers>=4.41,<5",
]
notebook = [
    "ipykernel>=6",
    "ipywidgets>=8",
    "jupyterlab>=4",
]
generation = [
    "httpx>=0.28,<1",
]
hf-convert = [
    "torch",
    "transformers==4.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -n 4 --dist worksteal -m 'not integration and not benchmark'"
markers = [
    "integration: tests that require prepared datasets, checkpoints, or extended training",
    "benchmark: resource-intensive end-to-end, accelerator, memory, or timing tests",
]
